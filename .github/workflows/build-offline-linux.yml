name: Build & Test Umi-OCR Linux Offline Package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgl1-mesa-glx libglib2.0-0 xvfb wget tar xz-utils curl jq \
            libxcb-xinerama0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-sync1 libxcb-xfixes0 libxcb-xkb1 libxcb-util1 libxkbcommon0

      - name: "1. Download Umi-OCR release & remove old/incompatible binaries"
        run: |
          mkdir -p build && cd build
          # 下载 Umi-OCR 官方 Linux 发行包
          wget -q https://github.com/hiroi-sora/Umi-OCR/releases/download/v2.1.5/Umi-OCR_Linux_Paddle_2.1.5.tar.xz
          tar -xf Umi-OCR_Linux_Paddle_2.1.5.tar.xz
          mv Umi-OCR_Linux_Paddle_2.1.5 Umi-OCR
          rm Umi-OCR_Linux_Paddle_2.1.5.tar.xz

          # 关键修复 1：彻底删除官方打包在 Debian 11 上、需要 GLIBC>=2.29/2.30 的 .embeddable
          rm -rf Umi-OCR/UmiOCR-data/.embeddable

          # 关键修复 2：删除老旧的 v3 C++ 引擎（避免与旧系统 glibc 冲突，同时缩减 ~300MB 体积）
          rm -rf Umi-OCR/UmiOCR-data/plugins/linux_x64_PaddleOCR-json_v141

          # 克隆二开新引擎仓库
          git clone --depth 1 https://github.com/chapterv/umi-paddle-neoengine.git

          # 将插件植入 Umi-OCR 插件目录
          cp -r umi-paddle-neoengine/win_x64_PaddleOCR_Py Umi-OCR/UmiOCR-data/plugins/

          # 仅覆盖宿主 py_src 与 qt_res 模块补丁（绝不覆盖插件目录，保持插件为最新版 v1.4.2）
          PATCH_DIR=umi-paddle-neoengine/patches/umi-host
          if [ -d "$PATCH_DIR" ]; then
              python3 "$GITHUB_WORKSPACE/scripts/apply_host_patches.py" "$PATCH_DIR" "Umi-OCR/UmiOCR-data"
          fi

      - name: "2. Build GLIBC 2.17+ compatible Host Portable Python 3.10 (.embeddable)"
        run: |
          cd build/Umi-OCR/UmiOCR-data
          
          # 获取官方 python-build-standalone Python 3.10 (最低支持 GLIBC 2.17)
          python3 -c "
          import urllib.request, json
          url = 'https://api.github.com/repos/astral-sh/python-build-standalone/releases/latest'
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          with urllib.request.urlopen(req) as resp:
              data = json.loads(resp.read().decode())
          for asset in data.get('assets', []):
              if 'cpython-3.10' in asset['name'] and 'x86_64-unknown-linux-gnu-install_only.tar.gz' in asset['name']:
                  print(asset['browser_download_url'])
                  break
          " > py310_url.txt
          PY310_URL=$(cat py310_url.txt)
          echo "Downloading Host Portable Python 3.10: $PY310_URL"
          curl -sL "$PY310_URL" -o py310.tar.gz
          tar -xzf py310.tar.gz
          mv python .embeddable
          rm py310.tar.gz py310_url.txt

          # 安装 Umi-OCR 宿主所需依赖（PySide2 仅支持至 3.10）
          ./.embeddable/bin/python3 -m pip install --upgrade pip
          CC=gcc ./.embeddable/bin/python3 -m pip install "PySide2==5.15.2.1" "PyMuPDF>=1.23" "fonttools>=4.47" "pillow>=10.2" "psutil>=5.9" "pynput" "zxing-cpp" "requests"

          # 执行运行时补丁：自动配置 Qt 平台插件路径、qt.conf、打包系统 XCB 库及升级启动脚本
          python3 "$GITHUB_WORKSPACE/scripts/patch_runtime.py" "$GITHUB_WORKSPACE/build/Umi-OCR"

      - name: "3. Deploy Portable Python 3.11 for PP-OCRv6 Plugin"
        run: |
          cd build/Umi-OCR/UmiOCR-data/plugins/win_x64_PaddleOCR_Py
          
          # 获取独立的 Python 3.11 便携环境 (最低支持 GLIBC 2.17)
          python3 -c "
          import urllib.request, json
          url = 'https://api.github.com/repos/astral-sh/python-build-standalone/releases/latest'
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          with urllib.request.urlopen(req) as resp:
              data = json.loads(resp.read().decode())
          for asset in data.get('assets', []):
              if 'cpython-3.11' in asset['name'] and 'x86_64-unknown-linux-gnu-install_only.tar.gz' in asset['name']:
                  print(asset['browser_download_url'])
                  break
          " > py311_url.txt
          PY311_URL=$(cat py311_url.txt)
          echo "Downloading Plugin Portable Python 3.11: $PY311_URL"
          curl -sL "$PY311_URL" -o python_portable.tar.gz
          tar -xzf python_portable.tar.gz
          mv python .venv_portable
          rm python_portable.tar.gz py311_url.txt

          # 生成 Linux 启动脚本 run.sh（彻底隔离宿主环境变量）
          cat << 'EOF' > run.sh
          #!/usr/bin/env bash
          DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          unset PYTHONHOME
          unset PYTHONPATH
          unset QT_QPA_PLATFORM_PLUGIN_PATH
          unset QT_PLUGIN_PATH

          # 过滤掉宿主环境可能泄露的 .embeddable 和 PySide2 路径，彻底防止 Python 3.10 / 3.11 动态库混淆
          CLEAN_LD=""
          IFS=':' read -ra ADDR <<< "$LD_LIBRARY_PATH"
          for i in "${ADDR[@]}"; do
              if [[ "$i" != *".embeddable"* ]] && [[ "$i" != *"PySide2"* ]]; then
                  CLEAN_LD="${CLEAN_LD:+$CLEAN_LD:}$i"
              fi
          done

          export PYTHONUTF8=1
          export PYTHONIOENCODING=utf-8
          export PADDLE_PDX_CACHE_HOME="$DIR/paddlex"
          export LD_LIBRARY_PATH="$DIR/.venv_portable/lib${CLEAN_LD:+:$CLEAN_LD}"
          exec "$DIR/.venv_portable/bin/python3" "$DIR/engine.py" "$@"
          EOF
          chmod +x run.sh

          # 安装新引擎推理依赖
          ./.venv_portable/bin/python3 -m pip install --upgrade pip
          ./.venv_portable/bin/python3 -m pip install paddlepaddle==3.2.1 paddleocr==3.7.0 onnxruntime==1.26.0 pymupdf opencv-python-headless pillow psutil openpyxl lxml scipy scikit-learn paddlex

      - name: "4. Pre-download all offline models (PP-OCRv6 + Tools)"
        run: |
          cd build/Umi-OCR/UmiOCR-data/plugins/win_x64_PaddleOCR_Py
          export PADDLE_PDX_CACHE_HOME="$(pwd)/paddlex"
          mkdir -p "$PADDLE_PDX_CACHE_HOME"

          ./.venv_portable/bin/python3 - << 'PY_EOF'
          from model_sources import configure_domestic_model_sources
          import paddleocr

          configure_domestic_model_sources()
          print(">>> 开始预下载并缓存 PP-OCRv6 离线模型...")
          kw = dict(
              device="cpu",
              engine="onnxruntime",
              engine_config={"providers": ["CPUExecutionProvider"]},
              use_textline_orientation=True,
              use_doc_orientation_classify=False,
              use_doc_unwarping=False,
              cpu_threads=4
          )
          # 1. PP-OCRv6 medium (中英文通用，含工具模型)
          print("下载 PP-OCRv6 medium...")
          paddleocr.PaddleOCR(lang="ch", ocr_version="PP-OCRv6", **kw)

          # 2. PP-OCRv6 small (轻量中英文模型)
          print("下载 PP-OCRv6 small...")
          paddleocr.PaddleOCR(lang="ch", ocr_version="PP-OCRv6", text_detection_model_name="PP-OCRv6_small_det", text_recognition_model_name="PP-OCRv6_small_rec", **kw)

          print(">>> 离线模型下载与缓存完成！")
          PY_EOF

      - name: "5. CI Test: verify both Host & Engine offline environments"
        run: |
          cd build/Umi-OCR

          # 1. 验证宿主运行环境 (在 xvfb-run 下测试 QGuiApplication 初始化及全部核心业务模块导入)
          echo ">>> 验证 Umi-OCR 宿主 Python 3.10 环境及业务模块导入..."
          (
            cd UmiOCR-data
            source .embeddable/activate.sh
            xvfb-run -a env QT_DEBUG_PLUGINS=1 python3 "$GITHUB_WORKSPACE/scripts/test_host.py"
          )

          # 2. 验证新引擎子进程管道 (PaddleOCR PP-OCRv6 + ONNX 采用完整 GUI 参数模拟)
          echo ">>> 验证 PP-OCRv6 引擎子进程完整 GUI 参数推理通道..."
          cd UmiOCR-data/plugins/win_x64_PaddleOCR_Py
          unset PYTHONHOME
          unset PYTHONPATH

          ./.venv_portable/bin/python3 - << 'TEST_EOF'
          import subprocess
          import json
          import cv2
          import numpy as np
          import sys
          import time

          img = np.full((120, 400, 3), 255, dtype=np.uint8)
          cv2.putText(img, "TEST OK 123", (30, 70), cv2.FONT_HERSHEY_SIMPLEX, 1.2, (0, 0, 0), 2)
          cv2.imwrite("/tmp/test_ocr.png", img)

          full_args = [
              "./run.sh",
              "--engine=onnxruntime",
              "--ocr_version=PP-OCRv6",
              "--cpu_threads=4",
              "--table_structure=False",
              "--config_path=models/config_chinese.txt",
              "--limit_side_len=1920",
              "--enable_mkldnn=True",
              "--fallback_chain=PP-OCRv6,PP-OCRv5,PP-OCRv4",
              "--use_doc_orientation=True",
              "--use_doc_unwarping=True",
              "--use_textline_orientation=True"
          ]

          p = subprocess.Popen(
              full_args,
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
              bufsize=1
          )

          init_line = p.stdout.readline().strip()
          print("Engine init line:", init_line)
          if "OCR init completed." not in init_line:
              print("Init failed! Stderr:\n", p.stderr.read())
              sys.exit(1)

          req = {"task": "ocr", "image_path": "/tmp/test_ocr.png"}
          p.stdin.write(json.dumps(req) + "\n")
          p.stdin.flush()

          resp_line = p.stdout.readline().strip()
          print("OCR response:", resp_line)
          resp = json.loads(resp_line)
          if resp.get("code") == 100:
              print("✅ [Pass] CI 完整参数离线识别测试通过！")
          else:
              print(f"❌ [Fail] 识别返回异常码: {resp.get('code')}")
              sys.exit(1)

          p.terminate()
          TEST_EOF

      - name: "6. Add desktop shortcut generator & package"
        run: |
          # 确保根目录有 icon.png，供快捷方式直接引用
          if [ -f "build/Umi-OCR/docs/images/icon-256.png" ]; then
              cp -f "build/Umi-OCR/docs/images/icon-256.png" "build/Umi-OCR/icon.png"
              mkdir -p build/Umi-OCR/UmiOCR-data/icon
              cp -f "build/Umi-OCR/docs/images/icon-256.png" "build/Umi-OCR/UmiOCR-data/icon/icon-256.png"
          fi

          # 写入统信 UOS / Linux 桌面图标一键生成脚本
          cat << 'EOF' > build/Umi-OCR/create-desktop-shortcut.sh
          #!/usr/bin/env bash
          APP_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          DESKTOP_DIR="${HOME}/Desktop"
          [ -d "${HOME}/桌面" ] && DESKTOP_DIR="${HOME}/桌面"

          DESKTOP_FILE="${DESKTOP_DIR}/Umi-OCR.desktop"
          MENU_FILE="${HOME}/.local/share/applications/Umi-OCR.desktop"

          chmod +x "${APP_DIR}/umi-ocr.sh"

          # 保证根目录 icon.png 存在
          if [ ! -f "${APP_DIR}/icon.png" ] && [ -f "${APP_DIR}/docs/images/icon-256.png" ]; then
              cp -f "${APP_DIR}/docs/images/icon-256.png" "${APP_DIR}/icon.png"
          fi

          # 安装图标到系统用户图标缓存
          mkdir -p "${HOME}/.local/share/icons/hicolor/256x256/apps"
          if [ -f "${APP_DIR}/icon.png" ]; then
              cp -f "${APP_DIR}/icon.png" "${HOME}/.local/share/icons/hicolor/256x256/apps/umi-ocr.png"
          fi

          printf "[Desktop Entry]\nType=Application\nName=Umi-OCR\nComment=Umi-OCR\nExec=\"%s/umi-ocr.sh\"\nPath=%s\nIcon=%s/icon.png\nTerminal=false\nCategories=Office;Utility;\n" "${APP_DIR}" "${APP_DIR}" "${APP_DIR}" > "$DESKTOP_FILE"

          chmod +x "$DESKTOP_FILE"

          mkdir -p "${HOME}/.local/share/applications"
          cp -f "$DESKTOP_FILE" "$MENU_FILE"

          echo "✅ 统信 UOS / Linux 桌面与应用菜单快捷方式创建成功！"
          EOF
          chmod +x build/Umi-OCR/create-desktop-shortcut.sh

          cd build
          # 清理 python 编译缓存减小包体积
          find Umi-OCR -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          tar -czvf Umi-OCR-Linux-Offline-PPOCRv6.tar.gz Umi-OCR/

      - name: "7. Upload Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: Umi-OCR-Linux-Offline-PPOCRv6
          path: build/Umi-OCR-Linux-Offline-PPOCRv6.tar.gz
          retention-days: 7

      - name: "8. Create GitHub Release on Tag"
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Umi-OCR-Linux-Offline-PPOCRv6.tar.gz
          generate_release_notes: true
